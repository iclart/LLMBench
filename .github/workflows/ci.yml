name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test under ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-asan -j4
          ctest --test-dir build-asan --output-on-failure
      - name: Stub compiles with the official contestant flags
        working-directory: tasks/railway
        run: g++ -O2 -std=c++20 -pthread -Wall -Wextra -Wpedantic -Werror -Iinclude -c stub/solution.cpp -o /dev/null

  windows-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      # Includes the golden-hash check: generator output must match Linux byte for byte.
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stub compiles with the official contestant flags
        working-directory: tasks/railway
        run: g++ -O2 -std=c++20 -pthread -Wall -Wextra -Wpedantic -Werror -Iinclude -c stub/solution.cpp -o stub.o
