name: CI

# main only ever fast-forwards to commits that already passed on their branch,
# so pushes to main do not run again (use "Run workflow" to force a run).
# Documentation-only pushes are skipped; a newer push cancels an older run.
on:
  push:
    branches-ignore: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4 --timeout 1200
      - name: Stub compiles with the official contestant flags
        working-directory: tasks/railway
        run: g++ -O2 -std=c++20 -pthread -Wall -Wextra -Wpedantic -Werror -Iinclude -c stub/solution.cpp -o /dev/null

  # Memory errors in the tools, the harness and the engines, on small workloads.
  # Skipped: the 1- and 16-thread runs (the 4-thread ones cover the same code),
  # the mutants (they test the judge's logic, covered by the Release job) and
  # the Python end-to-end tests (their address-space cap clashes with shadow memory).
  linux-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-asan -j4
      - name: Test under ASan and UBSan
        run: ctest --test-dir build-asan --output-on-failure -j4 --timeout 1800 -E "_t1$|_t16$|rail_mutant_|rail_eval_smoke|rail_report_smoke|rail_package_selftest"

  linux-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRAIL_TSAN=ON
          cmake --build build-tsan -j4
      # Concurrent runs must be race-free; the data-race mutant must be rejected.
      - name: Concurrent tests under TSan
        run: ctest --test-dir build-tsan --output-on-failure -j4 --timeout 1800 -R "rail_bench_.*_t4|rail_mutant_data_race"

  windows-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      # Includes the golden-hash check: generator output must match Linux byte for byte.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4 --timeout 1200
      - name: Stub compiles with the official contestant flags
        working-directory: tasks/railway
        run: g++ -O2 -std=c++20 -pthread -Wall -Wextra -Wpedantic -Werror -Iinclude -c stub/solution.cpp -o stub.o
